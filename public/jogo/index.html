<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ferramenta de estudos jurídicos com mnemônicos, competências e lacunas da Constituição Federal.">
    <title>Estuda TRT</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" />
    <script src="https://kit.fontawesome.com/7113fe860c.js" crossorigin="anonymous"></script>

    <link href="/jogo/css/style.css" rel="stylesheet" />
</head>

<body onload="getItemData(), getItemData2(), carregarArtigosComLacunas(), iniciarPlacar()">
    <div id="app" class="container mt-4 mb-4 p-4 shadow-sm rounded-lg">
        <h1 class="text-center mb-2 text-primary fw-bold">Estuda TRT</h1>

        <div class="placar-barra" id="placar-barra">
            <span class="placar-texto" id="placar-texto">Carregando pontuação...</span>
        </div>

        <ul class="nav nav-tabs nav-justified" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="mnemonicos-tab" data-bs-toggle="tab" data-bs-target="#mnemonicos"
                    type="button" role="tab" aria-controls="mnemonicos" aria-selected="true">Mnemônicos</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="competencias-tab" data-bs-toggle="tab" data-bs-target="#competencias"
                    type="button" role="tab" aria-controls="competencias" aria-selected="false">Competências</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="lacunas-tab" data-bs-toggle="tab" data-bs-target="#lacunas" type="button"
                    role="tab" aria-controls="lacunas" aria-selected="false">CF - Lacunas</button>
            </li>
        </ul>

        <div class="tab-content" id="tab-content-jogo">
            <div class="tab-pane fade show active" id="mnemonicos" role="tabpanel" aria-labelledby="mnemonicos-tab">
                </div>
            <div class="tab-pane fade" id="competencias" role="tabpanel" aria-labelledby="competencias-tab">
                </div>
            <div class="tab-pane fade" id="lacunas" role="tabpanel" aria-labelledby="lacunas-tab">
                </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>

    <script src="/jogo/src/index.js"></script>
</body>

</html>
