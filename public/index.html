<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Edital</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Meu Edital</h1>
            <div class="stats">
                <div class="progress-bar">
                    <div id="progress-fill"></div>
                </div>
                <span id="progress-text">0/0 (0%)</span>
            </div>
        </header>

        <nav class="planos-tabs" id="planos-tabs">
            <!-- abas dos planos (ex: TRT, ENAM) inseridas via JS -->
        </nav>

        <!-- --- CRONÔMETRO DE ESTUDO --- -->
        <section class="timer-card" id="timer-card">
            <div class="timer-display-wrap">
                <span class="timer-label" id="timer-status-label">Pronto para começar</span>
                <div class="timer-display" id="timer-display">00:00:00</div>
            </div>
            <div class="timer-actions">
                <button class="timer-btn timer-btn-start" id="btn-timer-iniciar" onclick="iniciarCronometro()">▶ Iniciar</button>
                <button class="timer-btn timer-btn-pause" id="btn-timer-pausar" onclick="pausarCronometro()" style="display:none;">⏸ Pausar</button>
                <button class="timer-btn timer-btn-resume" id="btn-timer-retomar" onclick="retomarCronometro()" style="display:none;">▶ Retomar</button>
                <button class="timer-btn timer-btn-stop" id="btn-timer-finalizar" onclick="abrirModalSessao()" style="display:none;">⏹ Finalizar</button>
            </div>
        </section>

        <nav class="view-tabs" id="view-tabs">
            <button class="view-tab ativo" id="tab-edital" onclick="trocarView('edital')">📋 Edital</button>
            <button class="view-tab" id="tab-estudos" onclick="trocarView('estudos')">📊 Painel de Estudos</button>
        </nav>

        <!-- ===================== VIEW: EDITAL ===================== -->
        <div id="view-edital">
            <section class="add-section">
                <input type="text" id="materia-input" placeholder="Matéria (ex: Português)">
                <textarea id="bulk-input" placeholder="Cole os tópicos do edital aqui (um por linha)"></textarea>
                <div class="planos-check-label">Vincular aos planos:</div>
                <div class="planos-checkboxes" id="planos-checkboxes-import">
                    <!-- checkboxes dos planos inseridos via JS -->
                </div>
                <button onclick="importarEdital()">Importar Tópicos</button>
            </section>

            <main id="lista-edital">
                </main>
        </div>

        <!-- ===================== VIEW: PAINEL DE ESTUDOS ===================== -->
        <div id="view-estudos" style="display:none;">

            <section class="dashboard-grid" id="dashboard-grid">
                <!-- cards de estatísticas inseridos via JS -->
            </section>

            <section class="painel-bloco">
                <div class="painel-bloco-header">
                    <h2>🔔 Revisões pendentes</h2>
                </div>
                <div id="lista-revisoes" class="lista-revisoes">
                    <!-- cards de revisão inseridos via JS -->
                </div>
            </section>

            <section class="painel-bloco">
                <div class="painel-bloco-header">
                    <h2>🕒 Histórico de sessões</h2>
                </div>
                <div id="lista-historico" class="lista-historico">
                    <!-- itens de histórico inseridos via JS -->
                </div>
            </section>

        </div>
    </div>

    <!-- Modal de edição de tópico (texto, matéria e planos) -->
    <div id="modal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h3>Editar Tópico</h3>
            <label class="modal-label">Matéria</label>
            <input type="text" id="modal-materia-input">
            <label class="modal-label">Tópico</label>
            <input type="text" id="modal-topico-input">
            <label class="modal-label">Planos (compartilhe entre planos marcando mais de um)</label>
            <div class="planos-checkboxes" id="planos-checkboxes-modal">
                <!-- checkboxes dos planos inseridos via JS -->
            </div>
            <div class="modal-actions">
                <button class="btn-cancelar" onclick="fecharModalEdicao()">Cancelar</button>
                <button onclick="salvarEdicaoTopico()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Modal de finalização de sessão de estudo -->
    <div id="modal-sessao-overlay" class="modal-overlay" style="display:none;">
        <div class="modal modal-sessao">
            <h3>Finalizar sessão de estudo</h3>

            <div class="sessao-duracao-box">
                <span class="sessao-duracao-label">Tempo estudado</span>
                <span class="sessao-duracao-valor" id="sessao-duracao-valor">00:00:00</span>
            </div>

            <label class="modal-label">Tipo de estudo</label>
            <div class="tipos-estudo-chips" id="tipos-estudo-chips">
                <!-- chips dos tipos de estudo inseridos via JS -->
            </div>
            <button type="button" class="link-btn" onclick="abrirModalTipos()">⚙ Gerenciar tipos de estudo</button>

            <label class="modal-label">Tópicos e subtópicos estudados</label>
            <input type="text" id="sessao-busca-topicos" class="busca-topicos" placeholder="Buscar matéria ou tópico..." oninput="filtrarTopicosSessao()">
            <div class="sessao-topicos-lista" id="sessao-topicos-lista">
                <!-- árvore de matérias/tópicos com checkboxes inserida via JS -->
            </div>

            <div id="campo-extra-questoes" class="campo-extra" style="display:none;">
                <label class="modal-label">Desempenho em questões</label>
                <div class="questoes-inputs">
                    <div class="questoes-input-group">
                        <label for="sessao-acertos">Acertos</label>
                        <input type="number" id="sessao-acertos" min="0" placeholder="0" oninput="atualizarResultadoQuestoes()">
                    </div>
                    <div class="questoes-input-group">
                        <label for="sessao-erros">Erros</label>
                        <input type="number" id="sessao-erros" min="0" placeholder="0" oninput="atualizarResultadoQuestoes()">
                    </div>
                    <div class="questoes-resultado" id="questoes-resultado">—</div>
                </div>
            </div>

            <div id="campo-extra-paginas" class="campo-extra" style="display:none;">
                <label class="modal-label">Páginas lidas</label>
                <input type="number" id="sessao-paginas" min="0" placeholder="Ex: 15">
            </div>

            <label class="modal-label">Observações (opcional)</label>
            <textarea id="sessao-observacoes" placeholder="Anotações sobre a sessão..."></textarea>

            <div class="revisao-box">
                <label class="revisao-check">
                    <input type="checkbox" id="sessao-revisao-check" onchange="atualizarPreviewRevisao()">
                    Agendar revisão deste conteúdo
                </label>
                <div class="revisao-dias-row" id="revisao-dias-row" style="display:none;">
                    <span>Lembrar em</span>
                    <input type="number" id="sessao-revisao-dias" min="1" value="7" onchange="atualizarPreviewRevisao()" oninput="atualizarPreviewRevisao()">
                    <span>dia(s)</span>
                    <span class="revisao-preview" id="revisao-preview"></span>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-cancelar" onclick="fecharModalSessao()">Cancelar</button>
                <button onclick="salvarSessao()">Salvar sessão</button>
            </div>
        </div>
    </div>

    <!-- Modal de gerenciamento de tipos de estudo -->
    <div id="modal-tipos-overlay" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h3>Tipos de estudo</h3>
            <div id="lista-tipos-estudo" class="lista-tipos-estudo">
                <!-- linhas de tipos de estudo inseridas via JS -->
            </div>

            <label class="modal-label">Novo tipo de estudo</label>
            <input type="text" id="novo-tipo-nome" placeholder="Ex: Podcast, Videoaula...">
            <label class="modal-label">Campo extra ao finalizar</label>
            <select id="novo-tipo-campo-extra">
                <option value="nenhum">Nenhum</option>
                <option value="questoes">Acertos / Erros (questões)</option>
                <option value="paginas">Páginas lidas</option>
            </select>
            <button type="button" onclick="criarTipoEstudo()">+ Adicionar tipo</button>

            <div class="modal-actions">
                <button onclick="fecharModalTipos()">Concluído</button>
            </div>
        </div>
    </div>

    <script src="/src/app.js"></script>
</body>
</html>
